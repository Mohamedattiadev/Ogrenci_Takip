services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yoklama_owner
      POSTGRES_PASSWORD: owner_pw
      POSTGRES_DB: yoklama
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yoklama_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoklama_owner -d yoklama"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yoklama_pg_data:
